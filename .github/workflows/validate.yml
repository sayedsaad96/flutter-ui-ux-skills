name: Validate Skills

on:
  push:
  pull_request:

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run all static tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate skill metadata
        run: python scripts/validate_skills.py .
      - name: Validate eval prompt/expectation isolation
        run: python scripts/validate_evals.py .
      - name: Validate canonical scenario fingerprints
        run: python scripts/eval_manifest.py .
      - name: Reject placeholder markers in public skill files
        run: |
          python - <<'PY'
          from pathlib import Path
          forbidden = ["T" + "BD", "T" + "ODO", "implement " + "later", "fill in " + "details"]
          hits = []
          for path in Path("skills").rglob("*"):
              if path.is_file():
                  body = path.read_text(encoding="utf-8", errors="ignore")
                  hits.extend(f"{path}: {marker}" for marker in forbidden if marker.lower() in body.lower())
          if hits:
              raise SystemExit("Placeholder markers found:\n" + "\n".join(hits))
          print("No placeholder markers")
          PY
